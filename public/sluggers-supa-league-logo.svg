<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1470" role="img" aria-labelledby="title desc">
<title id="title">Sluggers Supa League</title><desc id="desc">Mario swing silhouette fully enclosed in a baseball diamond with straight red-blue split and SSL letters forming a V; league name below the badge.</desc>
<defs>
<clipPath id="diamond"><path d="M600 65L1130 595L600 1125L70 595Z"/></clipPath>
<radialGradient id="spotlight" cx="50%" cy="43%" r="50%"><stop offset="0" stop-color="#fff5bc" stop-opacity=".28"/><stop offset=".55" stop-color="#ffdb5a" stop-opacity=".11"/><stop offset="1" stop-color="#ffdb5a" stop-opacity="0"/></radialGradient>
<radialGradient id="edgeShade" cx="50%" cy="47%" r="67%"><stop offset="0" stop-color="#071d4a" stop-opacity="0"/><stop offset=".64" stop-color="#071d4a" stop-opacity=".02"/><stop offset="1" stop-color="#071d4a" stop-opacity=".27"/></radialGradient>
