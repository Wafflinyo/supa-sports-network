name: Publish the playable SSL Draft Lottery Video
on:
  push:
    branches: [main]
    paths:
      - 'scripts/host-lottery-video.py'
      - '.github/workflows/host-lottery-video.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.2.6' 'pillow==11.3.0' 'openpyxl==3.1.5'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render all 12 lottery picks and sound effects
        run: python scripts/host-lottery-video.py
      - name: Verify MP4 for Safari
        run: |
          ffprobe -v error -show_entries stream=codec_name,profile,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 public/videos/ssl-draft-lottery-12-picks.mp4
          test $(stat -c%s public/videos/ssl-draft-lottery-12-picks.mp4) -gt 1000000
      - name: Save a permanent copy to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/videos/ssl-draft-lottery-12-picks.mp4
          git commit -m 'Publish SSL sample lottery MP4 for normal browser playback' || true
          git push
      - run: python scripts/build_games_played.py
      - run: python scripts/build_fantasy_games.py
      - run: python scripts/build_temporary_results.py
      - run: python scripts/check_player_data.py
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
