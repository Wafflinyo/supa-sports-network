name: Publish the playable SSL Draft Lottery Video
on:
  push:
    branches: [main]
    paths:
      - 'src/BingoLottery.jsx'
      - 'src/bingo-lottery.css'
      - 'scripts/host-silent-lottery-video.mjs'
      - 'scripts/lottery-video/**'
      - 'scripts/host-lottery-video.py'
      - '.github/workflows/host-lottery-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ssl-lottery-video-generator
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Playwright video-render dependency
        run: npm install --no-save --no-package-lock playwright@1.58.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install video-only encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render all 12 picks from the real silent machine
        run: node scripts/host-silent-lottery-video.mjs
      - name: Verify web-playable MP4 is video-only
        run: |
          ffprobe -v error -show_entries stream=codec_name,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 public/videos/ssl-draft-lottery-12-picks.mp4
          test $(stat -c%s public/videos/ssl-draft-lottery-12-picks.mp4) -gt 1000000
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 public/videos/ssl-draft-lottery-12-picks.mp4)"
      - name: Keep QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ssl-lottery-silent-machine-stills
          path: dist/silent-lottery-*.png
          retention-days: 14
      - name: Save new silent preview to the website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/videos/ssl-draft-lottery-12-picks.mp4
          git commit -m 'Publish silent SSL lottery machine preview' || true
          git pull --rebase origin main
          git push origin HEAD:main
      # The push above triggers the normal Pages deployment.
