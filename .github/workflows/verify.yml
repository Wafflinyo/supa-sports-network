name: Verify website changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/check_player_data.py
      - run: npm ci
      - run: node tests/stadiums.mjs
      - run: node tests/draft-stadium-state.mjs
      - run: node tests/pause-timer-only.mjs
      - run: node tests/draft-player-cards.mjs
      - run: node tests/site-mii-trajectories-and-chemistry.mjs
      - run: node tests/lottery-timing.mjs
      - run: node tests/lottery-curtain.mjs
      - run: node tests/draft-order-views.mjs
      - run: node tests/gm-my-team-draft-history.mjs
      - run: node tests/heating-up.mjs
      - run: node tests/ssl-custom-game-score.mjs
      - run: node tests/game-point-column-visibility.mjs
      - run: node tests/preseason-no-hot-games.mjs
      - run: node tests/preseason-mii-name-mapping.mjs
      - run: node tests/preseason-waluigi-plate-appearances.mjs
      - run: node tests/game-box-score-links.mjs
      - run: node tests/league-news.mjs
      - run: node tests/gm-achievements.mjs
      - run: node tests/preseason-rankings-and-bracket.mjs
      - run: node tests/preseason-ruffians-dedennes-import.mjs
      - run: node tests/preseason-knights-dolphins-import.mjs
      - run: node tests/preseason-hopedogo-voidstriders-import.mjs
      - run: node tests/preseason-haliban-petilils-import.mjs
      - run: node tests/gm-achievement-notifications.mjs
      - run: node tests/badge-art-design.mjs
      - run: node tests/roster-lineups.mjs
      - run: node tests/lineup-status-and-heat-120.mjs
      - run: node tests/schedule-matchup-records.mjs
      - run: node tests/stadium-lighting.mjs
      - run: node tests/public-tbd-schedule.mjs
      - run: node tests/trade-negotiation.mjs
      - run: npm run build
        env:
          GITHUB_PAGES_BASE: /supa-sports-network/
