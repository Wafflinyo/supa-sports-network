name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Keep an in-progress publication alive while future code changes queue.
# Cancelling an already-started Pages deployment can strand its backend lock.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      bundle_asset: ${{ steps.bundle.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openpyxl==3.1.5'
      - run: python scripts/build_games_played.py
      - run: python scripts/build_fantasy_games.py
      - run: python scripts/build_temporary_results.py
      - run: python scripts/sync_fantasy_schedule.py
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: python scripts/check_player_data.py
      - run: npm ci
      - run: node tests/lottery-timing.mjs
      - run: node tests/matchup-display.mjs
      - run: node tests/trade-negotiation.mjs
      - run: node tests/trade-block.mjs
      - run: node tests/game-point-column-visibility.mjs
      - run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Record built website asset for publishing verification
        id: bundle
        run: |
          ASSET=$(grep -oE 'assets/index-[^"]+[.]js' dist/index.html | head -n 1)
          test -n "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish and verify live website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: '900000'
      - name: Verify the live page references this exact build
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_ASSET: ${{ needs.build.outputs.bundle_asset }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location --max-time 15 "$SITE_URL?deployment=$GITHUB_SHA" | grep -Fq "$EXPECTED_ASSET"; then
              echo "The live SSL site is serving the new asset $EXPECTED_ASSET"
              exit 0
            fi
            echo "The site is still serving older assets (check $attempt of 20)"
            sleep 6
          done
          echo "::error::GitHub Pages reported success, but the live site is not serving this build."
          exit 1

  mobile-qa:
    # Mobile screenshot QA remains automatic, but never blocks the public
    # website deployment if Playwright's OS package installation is slow.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser for mobile checks
        run: |
          npm install --prefix "$RUNNER_TEMP/ssn-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/ssn-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify mobile workflows and capture sample screenshots
        run: node scripts/capture-mobile-workflows.mjs
        env:
          SSN_PLAYWRIGHT_MODULE: ${{ runner.temp }}/ssn-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssl-draft-trade-screenshots
          path: dist/ui-screenshots/
          retention-days: 30
